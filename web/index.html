<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Viewer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar">
    <button id="btn-toc" class="icon-button" title="Toggle outline (Ctrl+B)" aria-label="Toggle outline">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="btn-open" class="button" title="Open a file (Ctrl+O)">Open</button>
    <span id="doc-title" class="doc-title">Markdown Viewer</span>
    <span class="spacer"></span>
    <button id="btn-reload" class="icon-button" title="Reload (Ctrl+R)" aria-label="Reload">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <nav id="toc" aria-label="Outline"></nav>
    </aside>
    <main id="content">
      <article id="doc"></article>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
